name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile-check all Python
        run: python -m compileall -q anthropic_agent_stack claude_auto_mode commercial_engine tests

      - name: Run unit test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run integrated demo (asserts every stage; must exit 0)
        run: python -m anthropic_agent_stack.run_integrated_system

      - name: Run migration fleet CLI
        run: python -m commercial_engine.migration_oracle

      - name: Run ROI audit CLI
        run: python -m commercial_engine.roi_calculator

      - name: Verify no demo artifacts left in the working tree
        run: |
          if [ -e current_tasks ]; then
            echo "::error::current_tasks/ artifact left behind by the demo harness"
            exit 1
          fi
